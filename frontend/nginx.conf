#Course: SWE 645
#Purpose: It configures the Nginx web server to route React application traffic correctly.

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}