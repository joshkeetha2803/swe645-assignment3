#Purpose: Kubernetes deployment and service definitions for the frontend UI.

apiVersion: apps/v1

# Define a Deployment resource to manage frontend pods
kind: Deployment
metadata:
  name: frontend-deployment
spec:

# Set the number of frontend pod replicas dynamically from values.yaml
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend

      # Pull the frontend Docker image specified in values.yaml
        image: {{ .Values.frontend.image }}
        ports:
        - containerPort: 80
---
apiVersion: v1

# Define a Service resource to expose the frontend application
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

      # Map the service to a specific NodePort for browser access
      nodePort: {{ .Values.frontend.nodePort }}